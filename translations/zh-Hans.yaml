home.introduction:
  text: 我在苏黎世的 QRT 担任量化研究员，从事高频交易和短期预测研究。自 2022 年以来，我在 QRT 和 IMC 的工作涵盖机器学习信号、市场微观结构研究和实时交易系统。
  source_hash: e3b4a67bc4865dfae370716c88ab845c79a178325b487a0edadec880bd4ab9dc

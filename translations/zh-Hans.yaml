home.gardenpipe.description:
  html: <a href="https://github.com/LiJ21/GardenPipe">GardenPipe</a> — 以受限的批次内存处理任意规模的数据：专为单台工作站设计的训练与测试框架。
  source_hash: 379ff426b4d3ccd08ef4eb1e18c54ed91fc3f61d424c1972f76773eb2e94ab54
home.software:
  text: 我将统计研究与动手实践的性能工程相结合。十余年来，我一直使用 C++、Python、Fortran 和 CUDA 开发高性能软件。目前的开源工作主要围绕低延迟推理、内存受限的模型训练和高效的 C++ 数据结构。
  source_hash: 3736a7630d641b699ded9c8af7bb49c869da4e5d832f05e734718f9a76948413
project.GardenPipe.subtitle:
  text: 以受限的批次内存处理任意规模的数据
  source_hash: 8b725d2bbd975d07558269619b0985ef5d7365066fce3482b44e4ece6757252a
project.GardenPipe.description:
  text: 面向序列数据的训练与测试框架，数据量可达内存容量的许多倍。它按日期逐日读取，并以固定大小的批次流式处理，让内存成为由你设定的上限，而不是运行的副作用。
  source_hash: 9d9ddb7f76bfdc2f775b3d95674a2c9245fdc1a80695c2ce5d7523f023023733
project.GardenPipe.detail:
  text: 基于 Polars，专为单台工作站而非集群设计。有状态特征可跨批次延续，流式处理与完整运行的结果一致；后台预取受字节预算限制。数据量增长只增加时间，不增加内存。
  source_hash: f0fbc517a376f3ba7b757818cd17e10f92c0129e639beb68d1411f95361d1a51
projects.block03:
  text: 面向科学计算、机器学习与性能敏感系统的开源工具。每个项目针对一个具体的计算问题，源代码与实现细节均发布在 GitHub 上。
  source_hash: 99220efc646df061b7f4153b54442a8dc90298085bef6a920245308e28744323

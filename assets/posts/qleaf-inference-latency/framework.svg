<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title">
<title id="title">QLeaf: prepare once, predict repeatedly</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#111111"/></marker></defs>
<rect width="720" height="390" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#111111">
<text x="28" y="30" font-size="13" font-weight="600" text-anchor="start" fill="#111111">FRAMEWORK</text>
<rect x="28" y="54" width="190" height="62" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="123.0" y="90.0" font-size="15" font-weight="400" text-anchor="middle" fill="#111111">Forest + worker JSON</text>
<rect x="264" y="54" width="428" height="62" rx="4" fill="#111111" stroke="#111111"/>
<text x="478.0" y="90.0" font-size="15" font-weight="400" text-anchor="middle" fill="white">Inferrer: node buffer + tree partitions</text>
<path d="M219 85 L261 85" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="28" y="145" font-size="12" font-weight="600" text-anchor="start" fill="#111111">INITIALIZATION ABOVE · PER-REQUEST PATH BELOW</text>
<path d="M28 158 L692 158" fill="none" stroke="#d2d2d2" stroke-dasharray="5 5"/>
<rect x="28" y="212" width="150" height="66" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="103.0" y="250.0" font-size="15" font-weight="400" text-anchor="middle" fill="#111111">Feature row</text>
<rect x="242" y="180" width="226" height="58" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="355.0" y="204.0" font-size="15" font-weight="400" text-anchor="middle" fill="#111111">CPU workers</text>
<text x="355.0" y="224.0" font-size="15" font-weight="400" text-anchor="middle" fill="#111111">persistent host threads</text>
<rect x="242" y="258" width="226" height="58" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="355.0" y="282.0" font-size="15" font-weight="400" text-anchor="middle" fill="#111111">CUDA worker</text>
<text x="355.0" y="302.0" font-size="15" font-weight="400" text-anchor="middle" fill="#111111">one-shot or persistent</text>
<path d="M179 240 L239 209" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M179 250 L239 287" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="530" y="212" width="162" height="66" rx="4" fill="#111111" stroke="#111111"/>
<text x="611.0" y="240.0" font-size="15" font-weight="400" text-anchor="middle" fill="white">Collect + sum</text>
<text x="611.0" y="260.0" font-size="15" font-weight="400" text-anchor="middle" fill="white">raw margin</text>
<path d="M469 209 L527 240" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M469 287 L527 250" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="355" y="247" font-size="12" font-weight="400" text-anchor="middle" fill="#111111">OR</text>
<text x="28" y="359" font-size="14" font-weight="400" text-anchor="start" fill="#111111">Same prediction interface; backend and layout selected by C++ types.</text>
</g></svg>

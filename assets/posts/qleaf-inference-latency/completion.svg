<text x="105.5" y="356.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Block 1: local sum</text>
<rect x="331" y="335" width="138" height="32" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="400.0" y="356.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Slot 1</text>
<path d="M185 351 L328 351" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M471 351 L552 351" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="28" y="380" width="155" height="32" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="105.5" y="401.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Block 2: local sum</text>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title">
<title id="title">Shared GPU completion versus independent host result slots</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#111111"/></marker></defs>
<rect width="720" height="440" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#111111">
<text x="28" y="29" font-size="13" font-weight="600" text-anchor="start" fill="#111111">SHARED DEVICE-SIDE COMPLETION</text>
<rect x="28" y="55" width="155" height="34" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="105.5" y="77.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Block 0: local sum</text>
<path d="M185 72 L271 120" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="28" y="104" width="155" height="34" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="105.5" y="126.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Block 1: local sum</text>
<path d="M185 121 L271 120" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="28" y="153" width="155" height="34" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="105.5" y="175.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Block 2: local sum</text>
<path d="M185 170 L271 120" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="274" y="78" width="225" height="85" rx="4" fill="#111111" stroke="#111111"/>
<text x="386.5" y="115.5" font-size="15" font-weight="400" text-anchor="middle" fill="white">Atomic sum + counter</text>
<text x="386.5" y="135.5" font-size="15" font-weight="400" text-anchor="middle" fill="white">last block publishes</text>
<rect x="555" y="91" width="137" height="58" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="623.5" y="125.0" font-size="15" font-weight="400" text-anchor="middle" fill="#111111">Host result</text>
<path d="M500 120 L552 120" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="28" y="202" font-size="14" font-weight="400" text-anchor="start" fill="#111111">All blocks update shared completion state on the GPU.</text>
<path d="M28 221 L692 221" fill="none" stroke="#d2d2d2" stroke-dasharray="5 5"/>
<text x="28" y="250" font-size="13" font-weight="600" text-anchor="start" fill="#111111">INDEPENDENT HOST-VISIBLE SLOTS</text>
<text x="268" y="276" font-size="12" font-weight="600" text-anchor="middle" fill="#111111">PCIe</text>
<text x="400" y="276" font-size="12" font-weight="400" text-anchor="middle" fill="#111111">Pinned host memory</text>
<path d="M268 285 L268 408" fill="none" stroke="#d2d2d2" stroke-dasharray="5 5"/>
<rect x="28" y="290" width="155" height="32" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="105.5" y="311.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Block 0: local sum</text>
<rect x="331" y="290" width="138" height="32" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="400.0" y="311.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Slot 0</text>

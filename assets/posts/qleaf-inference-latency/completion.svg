<text x="400.0" y="401.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Slot 2</text>
<path d="M185 396 L328 396" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M471 396 L552 351" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="555" y="321" width="137" height="60" rx="4" fill="#111111" stroke="#111111"/>
<text x="623.5" y="346.0" font-size="14" font-weight="400" text-anchor="middle" fill="white">Host collects</text>
<text x="623.5" y="366.0" font-size="14" font-weight="400" text-anchor="middle" fill="white">and sums</text>
</g></svg>

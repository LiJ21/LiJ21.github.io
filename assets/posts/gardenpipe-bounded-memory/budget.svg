<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" role="img" aria-labelledby="title">
<title id="title">What GardenPipe holds in memory, and what grows with the data</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#111111"/></marker></defs>
<rect width="720" height="332" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#111111">
<text x="24.0" y="32.0" font-size="13" font-weight="600" text-anchor="start" fill="#111111">WHAT GROWS, AND WHAT DOES NOT</text>
<text x="24.0" y="66.0" font-size="14" font-weight="600" text-anchor="start" fill="#111111">On disk</text>
<text x="24.0" y="86.0" font-size="13" font-weight="400" text-anchor="start" fill="#505050">Grows with the data</text>
<rect x="36.0" y="150.0" width="136.0" height="46.0" rx="4" fill="white" stroke="#d2d2d2"/>
<rect x="32.0" y="138.0" width="136.0" height="46.0" rx="4" fill="white" stroke="#d2d2d2"/>
<rect x="28.0" y="126.0" width="136.0" height="46.0" rx="4" fill="white" stroke="#d2d2d2"/>
<rect x="24.0" y="114.0" width="136.0" height="46.0" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="96.0" y="134.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">One file per date</text>
<text x="96.0" y="214.0" font-size="13" font-weight="400" text-anchor="middle" fill="#505050">Any number of dates</text>
<path d="M216.0 50.0 L216.0 306.0" fill="none" stroke="#d2d2d2" stroke-width="1"/>
<text x="240.0" y="66.0" font-size="14" font-weight="600" text-anchor="start" fill="#111111">In memory</text>
<text x="240.0" y="86.0" font-size="13" font-weight="400" text-anchor="start" fill="#505050">Fixed by settings you choose</text>
<rect x="240.0" y="104.0" width="138.0" height="72.0" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="309.0" y="136.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">One window</text>
<text x="309.0" y="154.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">plus look-ahead</text>
<rect x="408.0" y="104.0" width="118.0" height="72.0" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="467.0" y="136.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">One batch</text>
<text x="467.0" y="154.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">rows × columns</text>
<rect x="556.0" y="104.0" width="140.0" height="72.0" rx="4" fill="#111111" stroke="#111111"/>
<text x="626.0" y="136.0" font-size="14" font-weight="400" text-anchor="middle" fill="white">Model state</text>
<text x="626.0" y="154.0" font-size="14" font-weight="400" text-anchor="middle" fill="white">depends on model</text>
<path d="M180.0 140.0 L238.0 140.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M378.0 140.0 L406.0 140.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M526.0 140.0 L554.0 140.0" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="240.0" y="194.0" width="286.0" height="46.0" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="383.0" y="222.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Prefetch budget, counted in bytes</text>
<rect x="240.0" y="256.0" width="456.0" height="40.0" rx="4" fill="#f5f5f5" stroke="#d2d2d2"/>
<text x="468.0" y="281.0" font-size="14" font-weight="400" text-anchor="middle" fill="#111111">Interpreter and libraries</text>
</g></svg>
